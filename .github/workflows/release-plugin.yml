name: Publish SyndaMorph Plugin Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-plugin-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'gnznovus/SyndaMorph' && github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the exact release event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a stable tag on the approved default branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_IMMUTABLE: ${{ github.event.release.immutable }}
        run: |
          if [[ "$RELEASE_IMMUTABLE" == "true" ]]; then
            echo 'Immutable releases require assets on the draft before publication; this published-event uploader cannot attach them.' >&2
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"

      - name: Validate PHP, JavaScript and updater behavior
        run: |
          find plugin -name '*.php' -print0 | xargs -0 -n1 php -l
          find plugin/assets renderer -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
          php tests/updater-test.php
          python3 -m unittest discover -s tests -p 'test_release_plugin.py' -v

      - name: Package and verify installable WordPress plugin and notes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/release_plugin.py --tag "$RELEASE_TAG" --output release-build --require-release-date

      - name: Preserve validated build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syndamorph-${{ github.event.release.tag_name }}
          path: release-build/*
          if-no-files-found: error

      - name: Publish matching changelog and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$RELEASE_TAG" --notes-file release-build/release-notes.md
          gh release upload "$RELEASE_TAG" release-build/syndamorph.zip.sha256
          gh release upload "$RELEASE_TAG" release-build/syndamorph.zip
