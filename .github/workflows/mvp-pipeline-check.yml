name: MVP autonomous pipeline checks
on:
  push:
    branches: [feat/mvp-autonomous-pipeline, feat/secure-gateway-leasing-v1]
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'plugin/includes/production-team.php'
      - 'plugin/includes/production-standards.php'
      - 'plugin/includes/production-job-memory.php'
      - 'plugin/includes/production-history.php'
      - 'plugin/assets/production-history.js'
      - 'plugin/assets/production-ai-export.js'
      - 'plugin/includes/ai-team-real.php'
      - 'plugin/includes/production-collaboration.php'
      - 'plugin/includes/production-block-plan.php'
      - 'plugin/includes/ai-models.php'
      - 'renderer/**'
      - 'plugin/assets/production-rich-content.js'
      - 'plugin/assets/ai-team-real.js'
      - 'tests/real-ai-poc-test.php'
      - 'tests/gutenberg-native-*'
      - 'plugin/includes/production-editor-learning.php'
      - 'plugin/includes/ai-integration.php'
      - 'plugin/syndamorph.php'
      - 'plugin/assets/production-team.js'
      - 'plugin/assets/production-workflow.js'
      - 'plugin/assets/ai-integration.js'
      - 'plugin/assets/operations-dashboard.css'
      - '.github/workflows/mvp-pipeline-check.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - 'plugin/includes/production-team.php'
      - 'plugin/includes/production-standards.php'
      - 'plugin/includes/production-job-memory.php'
      - 'plugin/includes/production-history.php'
      - 'plugin/assets/production-history.js'
      - 'plugin/assets/production-ai-export.js'
      - 'plugin/includes/ai-team-real.php'
      - 'plugin/assets/production-rich-content.js'
      - 'plugin/assets/ai-team-real.js'
      - 'tests/real-ai-poc-test.php'
      - 'tests/gutenberg-native-*'
      - 'plugin/includes/production-editor-learning.php'
      - 'plugin/includes/ai-integration.php'
      - 'plugin/syndamorph.php'
      - 'plugin/assets/production-team.js'
      - 'plugin/assets/production-workflow.js'
      - 'plugin/assets/ai-integration.js'
      - 'plugin/assets/operations-dashboard.css'
      - '.github/workflows/mvp-pipeline-check.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check backend/server.js
          node --check backend/purr-poc.js
          node --check plugin/assets/ai-integration.js
          node --check plugin/assets/ai-team-real.js
          node --check plugin/assets/production-rich-content.js
          php -l plugin/includes/production-standards.php
          php -l plugin/includes/production-history.php
          node --check plugin/assets/production-history.js
          node --check plugin/assets/production-ai-export.js
          php -l plugin/includes/ai-models.php
          php -l plugin/includes/ai-team-real.php
          php -l plugin/includes/production-block-plan.php
          php -l plugin/includes/production-collaboration.php
          php -l plugin/includes/production-job-memory.php
          node --check renderer/compare.js
          node --check renderer/render-worker.js
          node --check renderer/server.js
          php tests/real-ai-poc-test.php
          node --check plugin/assets/demo-dialogue.js
          node --check plugin/assets/production-team.js
          node --check plugin/assets/production-workflow.js
          php -l plugin/includes/production-team.php
          php -l plugin/includes/ai-integration.php
          php -l plugin/syndamorph.php
          php -l plugin/includes/gateway-admin.php
          node --check plugin/assets/gateway-admin.js
          node --check backend/gateway/server.js
          node --check backend/gateway/core.js
          node --check backend/mvp/plan.js
          node --check backend/mvp/registry.js
          node --check backend/mvp/loop.js
          node --check backend/mvp/claude.js
          node --check backend/mvp/endpoint.js
      - name: Backend and MVP tests
        run: |
          npm install --prefix backend --ignore-scripts --no-audit --no-fund
          npm test --prefix backend
      - name: Docker Compose validation
        run: docker compose config --quiet
      - name: Real Playwright inspection smoke test
        run: |
          docker build -t syndamorph-inspection ./renderer
          docker run -d --rm --name syndamorph-inspection-test -p 127.0.0.1:3999:3000 syndamorph-inspection
          trap 'docker rm -f syndamorph-inspection-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do if curl -fsS -o /dev/null http://127.0.0.1:3999/ 2>/dev/null || [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/ 2>/dev/null)" = 404 ]; then break; fi; sleep 1; done
          node --test renderer/inspect.test.js
      - name: Real WordPress Gutenberg serialization gate
        run: |
          docker compose up -d db wordpress
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 60); do if curl -fsS -o /dev/null http://127.0.0.1:8085/wp-admin/install.php; then break; fi; sleep 2; done
          curl -fsS -o /dev/null -X POST 'http://127.0.0.1:8085/wp-admin/install.php?step=2' --data 'weblog_title=CI&user_name=ciadmin&admin_password=ci-only-test-password&admin_password2=ci-only-test-password&admin_email=ci@example.invalid&blog_public=0&Submit=Install+WordPress'
          docker compose cp tests/gutenberg-native-fixture.php wordpress:/var/www/html/sm-native-fixture.php
          cd backend && npx playwright install --with-deps chromium && cd ..
          node tests/gutenberg-native-browser.cjs
      - name: Backend runtime packaging
        run: |
          docker build -t syndamorph-mvp ./backend
          docker run --rm --entrypoint node syndamorph-mvp -e "require('./mvp/endpoint'); require('./mvp/claude'); require('./purr-poc'); console.log('MVP and Purr modules available')"
          docker build -f backend/gateway/Dockerfile -t syndamorph-gateway ./backend
          docker run --rm --entrypoint node syndamorph-gateway -e "require('./gateway/core'); require('./gateway/store'); require('./gateway/server'); console.log('Gateway modules available')"
