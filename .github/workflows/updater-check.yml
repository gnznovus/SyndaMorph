name: Native Updater and Release Package Checks

on:
  pull_request:
  push:
    branches: [feat/p4b-layout-conversion, feat/mvp-autonomous-pipeline, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint and updater contract tests
        run: |
          find plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/updater-test.php
          php tests/ai-credential-lifecycle-test.php
      - name: JavaScript syntax
        run: find plugin/assets renderer -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Release packaging tests
        run: python3 -m unittest discover -s tests -p 'test_release_plugin.py' -v
