services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress_dev
      MARIADB_ROOT_PASSWORD: root_dev
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_dev
      WORDPRESS_DEBUG: "1"
      SYNDAMORPH_RENDERER_URL: "http://renderer:3000/render"
      SYNDAMORPH_BACKEND_URL: "http://backend:3100/capture"
      SYNDAMORPH_BACKEND_TOKEN: "local-poc-token-change-before-deployment"
      SYNDAMORPH_CAPTURE_HOSTS: "www.syndacast.com"
      # Only these third-party asset hosts may load; page navigation remains source-only.
      SYNDAMORPH_RESOURCE_HOSTS: "unpkg.com,cdn.jsdelivr.net,fonts.googleapis.com,fonts.gstatic.com"
    networks:
      - default
      - render_net
    volumes:
      - wp_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/syndamorph
      - ./config/syndamorph-upload.ini:/usr/local/etc/php/conf.d/syndamorph-upload.ini:ro

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    user: pwuser
    environment:
      SYNDAMORPH_BACKEND_TOKEN: "local-poc-token-change-before-deployment"
      SYNDAMORPH_CAPTURE_HOSTS: "www.syndacast.com"
      SYNDAMORPH_RESOURCE_HOSTS: "unpkg.com,cdn.jsdelivr.net,fonts.googleapis.com,fonts.gstatic.com"
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    shm_size: 256mb

  renderer:
    build: ./renderer
    restart: unless-stopped
    init: true
    user: pwuser
    networks:
      - render_net
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    shm_size: 256mb

networks:
  render_net:
    internal: true

volumes:
  db_data:
  wp_data:
